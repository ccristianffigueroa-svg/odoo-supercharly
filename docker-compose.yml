version: '3.8'

services:
  web:
    image: odoo:latest
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - PROXY_MODE=True
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./filestore:/var/lib/odoo/.local/share/Odoo/filestore
      - ./custom-addons:/mnt/extra-addons

  db:
    image: postgres:17
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: odoo-tunnel
    restart: unless-stopped
    command: tunnel --url http://web:8069
    depends_on:
      - web
volumes:
  odoo-web-data:
  odoo-db-data: